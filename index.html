<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#163a2b">
    <meta name="description" content="A private, device-local fat-loss progress tracker.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Progress">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icons/icon.svg">
    <link rel="stylesheet" href="./styles.css">
    <title>Fat Loss Tracker</title>
  </head>
  <body>
    <main>
      <p class="eyebrow">PWA foundation</p>
      <h1>Fat Loss Tracker</h1>
      <p class="intro">The project is installed, deployable, and ready for the full application requirements.</p>
      <section aria-labelledby="status-heading">
        <h2 id="status-heading">Setup complete</h2>
        <ul>
          <li>Mobile-first and iPhone-ready</li>
          <li>Installable from Safari</li>
          <li>Offline shell enabled</li>
          <li>No backend or account required</li>
        </ul>
      </section>
      <p id="connection-status" class="status" role="status">Checking offline support…</p>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
